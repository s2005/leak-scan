[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leak-scan"
version = "0.0.1"
description = "Scan a git-tracked tree for content that must not be published"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "s2005", email = "s2005@users.noreply.github.com" },
]
keywords = ["security", "git", "scanner", "secrets", "publication"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
leak-scan = "leak_scan.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/leak_scan"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Documentation and task records are not part of the Python codebase.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["leak_scan"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: Unit tests with no external dependencies",
    "integration: Integration tests requiring external services",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["leak_scan"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
